  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            even: {
              primary: '#1693e3',   // Azul claro vibrante
              secondary: '#053a6c', // Azul médio institucional
              tertiary: '#031f34',  // Azul muito escuro (fundo)
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            scroll: 'scroll 40s linear infinite',
            'scroll-fast': 'scroll 10s linear infinite',
          },
          keyframes: {
            scroll: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Animated Moving Light Effect */
    @keyframes moveLight {

      0%,
      100% {
        left: -30%;
      }

      50% {
        left: 130%;
      }
    }

    .animated-light {
      animation: moveLight 12s ease-in-out infinite;
    }
  </style>
